<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabulator Tables</title>

    <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">

    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js" type="text/javascript"></script>

    <style>
        .container {
            width: 80%;
            margin: 20px auto;
        }

        /* Basic styling for buttons */
        button {
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>


<div class="container">

    <div style="margin-bottom: 20px;">
        <button id="print-table">Print Table</button>
        <button id="download-csv">Download CSV</button>
        <button id="download-json">Download JSON</button>
        <button id="download-xlsx">Download XLSX</button>
        <button id="download-pdf">Download PDF</button>
        <button id="download-html">Download HTML</button>
    </div>
    <div id="userTable"></div>
</div>

<script src="/front-crud-api/js/tabulator.js"></script>
<script src="https://oss.sheetjs.com/sheetjs/xlsx.full.min.js" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.20/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
