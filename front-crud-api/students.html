<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Records</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .profile-pic {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container mt-3">
    <style>
        /* Make profile pictures circular and keep consistent size */
        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
        }
    </style>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Student Records</h2>

        <div class="d-flex align-items-center gap-2">
            <!-- Search by name -->
            <input
                    class="form-control"
                    id="searchInput"
                    placeholder="Search by name"
                    style="width: 220px;"
                    type="text"
            >

            <!-- Button to open Add Student modal -->
            <button class="btn btn-success" data-bs-target="#addStudentModal" data-bs-toggle="modal">
                Add Student
            </button>
        </div>
    </div>


    <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Gender</th>
            <th>Profile Pic</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="studentTableBody">

        </tbody>
    </table>
    <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- Bootstrap Modal: View Student -->
<div aria-hidden="true" aria-labelledby="viewStudentModalLabel" class="modal fade" id="viewStudentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="viewStudentModalLabel">Student Details</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <img alt="Profile Picture" class="profile-pic mt-2 d-none" id="modalProfilePic">
                <p><strong>First Name:</strong> <span id="modalFirstName"></span></p>
                <p><strong>Last Name:</strong> <span id="modalLastName"></span></p>
                <p><strong>Email:</strong> <span id="modalEmail"></span></p>
                <p><strong>Gender:</strong> <span id="modalGender"></span></p>

            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Student Modal -->
<div aria-hidden="true" aria-labelledby="addStudentModalLabel" class="modal fade" id="addStudentModal" tabindex="-1">
    <div class="modal-dialog">
        <form action="/students" class="modal-content" enctype="multipart/form-data" id="addStudentForm" method="POST">
            <div class="modal-header">
                <h5 class="modal-title" id="addStudentModalLabel">Add Student</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <!-- Student Fields -->
                <div class="mb-3">
                    <label class="form-label" for="firstNameInput">First Name</label>
                    <input class="form-control" id="firstNameInput" name="first_name" required type="text">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="lastNameInput">Last Name</label>
                    <input class="form-control" id="lastNameInput" name="last_name" required type="text">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="emailInput">Email</label>
                    <input class="form-control" id="emailInput" name="email" required type="email">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="genderSelect">Gender</label>
                    <select class="form-select" id="genderSelect" name="gender" required>
                        <option value="">-- Select --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="profilePicInput">Profile Picture</label>
                    <input accept="image/*" class="form-control" id="profilePicInput" name="profile_pic" type="file">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                <button class="btn btn-primary" type="submit">Save Student</button>
            </div>
        </form>
    </div>
</div>


<!-- Bootstrap Modal: Edit Student -->
<div aria-hidden="true" aria-labelledby="editStudentModalLabel" class="modal fade" id="editStudentModal" tabindex="-1">
    <div class="modal-dialog">
        <!-- action will be set dynamically in JS based on student id -->
        <form class="modal-content" enctype="multipart/form-data" id="editStudentForm" method="post">

            <div class="modal-header">
                <h5 class="modal-title" id="editStudentModalLabel">Edit Student</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal"
                        type="button"></button>
            </div>
            <div class="modal-body">
                <!-- first_name -->
                <div class="mb-3">
                    <label class="form-label" for="editFirstNameInput">First Name</label>
                    <input
                            class="form-control"
                            id="editFirstNameInput"
                            name="first_name"
                            required
                            type="text"
                    >
                </div>

                <!-- last_name -->
                <div class="mb-3">
                    <label class="form-label" for="editLastNameInput">Last Name</label>
                    <input
                            class="form-control"
                            id="editLastNameInput"
                            name="last_name"
                            required
                            type="text"
                    >
                </div>

                <!-- email -->
                <div class="mb-3">
                    <label class="form-label" for="editEmailInput">Email</label>
                    <input
                            class="form-control"
                            id="editEmailInput"
                            name="email"
                            required
                            type="email"
                    >
                </div>

                <!-- gender -->
                <div class="mb-3">
                    <label class="form-label" for="editGenderSelect">Gender</label>
                    <select
                            class="form-select"
                            id="editGenderSelect"
                            name="gender"
                            required
                    >
                        <option value="">-- Select --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- existing profile picture preview -->
                <div class="mb-3 text-center">
                    <label class="form-label">Current Profile Picture</label>
                    <br>
                    <img
                            alt="No Image"
                            class="profile-pic d-none"
                            id="editProfilePicPreview"
                            src=""
                            style="max-width:150px; border:1px solid #ccc; padding:4px; border-radius:8px;"
                    >
                </div>

                <!--                &lt;!&ndash; hidden field to store previous URL &ndash;&gt;-->
                <input id="editProfilePicHidden" name="existing_profile_pic" type="hidden">

                <!-- upload new profile_pic -->
                <div class="mb-3">
                    <label class="form-label" for="editProfilePicFile">Upload New Profile Pic</label>
                    <input
                            accept="image/*"
                            class="form-control"
                            id="editProfilePicFile"
                            name="profile_pic"
                            type="file"
                    />
                    >
                </div>

                <!-- hidden id if you want -->
                <input id="editStudentId" name="id" type="hidden">
            </div>
            <div class="modal-footer">
                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        type="button"
                >
                    Cancel
                </button>
                <button class="btn btn-primary" type="submit">Update Student</button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const apiUrl = 'http://localhost:3000/api/students'; // match your Node server PORT
    let studentsCache = []; // Array to store all students
    let currentPage = 1;
    let currentLimit = 5; // same as backend default
    let currentSearch = "";

    // Auth check
    function checkAuth() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login';
        }
        return token;
    }

    const token = checkAuth();

    // Fetch students (with search + pagination)
    async function fetchStudents(search = "", page = 1, limit = 3) {
        try {
            const response = await fetch(
                `${apiUrl}?search=${encodeURIComponent(search)}&page=${page}&limit=${limit}`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            if (!response.ok) throw new Error("Failed to fetch students");

            const data = await response.json();

            console.log("API Response:", data);

            // Extract array from API
            studentsCache = data.students;

            // Save current state
            currentPage = data.page || page;
            currentLimit = data.limit || limit;
            currentSearch = search;

            renderStudents(studentsCache, currentPage, currentLimit);
            renderPagination(data.totalPages);

        } catch (err) {
            console.error(err);
            alert("Error loading students");
        }
    }

    // Pagination renderer
    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        // Previous Button
        const prevButton = document.createElement('li');
        prevButton.classList.add('page-item');

        // disable if on first page
        if (currentPage === 1) prevButton.classList.add('disabled');

        prevButton.innerHTML = `
            <a class="page-link" href="#" onclick="fetchStudents('${currentSearch}', ${currentPage - 1})">
                Previous
            </a>
        `;
        paginationContainer.appendChild(prevButton);

        if (totalPages <= 1) return;

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            const pageLink = document.createElement('li');
            pageLink.classList.add('page-item');
            pageLink.innerHTML = `
                <a class="page-link" href="#" onclick="fetchStudents('${currentSearch}', ${i})">
                    ${i}
                </a>`;
            paginationContainer.appendChild(pageLink);
        }

        // Next Button
        const nextButton = document.createElement('li');
        nextButton.classList.add('page-item');

        // disable if on last page
        if (currentPage === totalPages) nextButton.classList.add('disabled');

        nextButton.innerHTML = `
            <a class="page-link" href="#" onclick="fetchStudents('${currentSearch}', ${currentPage + 1})">
                Next
            </a>
        `;
        paginationContainer.appendChild(nextButton);
    }

    // Render student rows
    function renderStudents(students, page = 1, limit = 5) {
        const tbody = document.querySelector('#studentTableBody');
        tbody.innerHTML = '';

        const startIndex = (page - 1) * limit; // offset for pagination

        students.forEach((student, index) => {
            const tr = document.createElement('tr');

            tr.dataset.studentId = student._id;
            tr.dataset.firstName = student.first_name;
            tr.dataset.lastName = student.last_name;
            tr.dataset.email = student.email;
            tr.dataset.gender = student.gender;
            tr.dataset.profilePic = student.profile_pic || '';

            tr.innerHTML = `
                <td>${startIndex + index + 1}</td>
                <td>${student.first_name}</td>
                <td>${student.last_name}</td>
                <td>${student.email}</td>
                <td>${student.gender}</td>
                <td>
                    ${student.profile_pic
                ? `<img src="${student.profile_pic}" alt="Profile Pic" class="profile-pic">`
                : 'N/A'}
                </td>
                <td>
                    <button type="button" onclick="openStudentModal(this.closest('tr'))" class="btn btn-sm btn-primary">
                        View
                    </button>
                    <button type="button" onclick="openEditStudentModal(this.closest('tr'))" class="btn btn-sm btn-warning">
                        Edit
                    </button>
                    <button type="button" onclick="deleteStudent(this.closest('tr').dataset.studentId)" class="btn btn-sm btn-danger">
                        Delete
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });
    }

    // Delete student
    async function deleteStudent(id) {
        if (!confirm('Are you sure you want to delete this student?')) return;

        try {
            const response = await fetch(`${apiUrl}/${id}`, {
                method: 'DELETE',
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || 'Failed to delete student');
            }

            // reload table after delete
            await fetchStudents();
        } catch (err) {
            console.error(err);
            alert('Error deleting student');
        }
    }

    // ------ Modals & Form Handlers ------

    const viewStudentModalElement = document.getElementById('viewStudentModal');
    const viewStudentModal = new bootstrap.Modal(viewStudentModalElement);

    const editStudentModalElement = document.getElementById('editStudentModal');


    function openStudentModal(trElement) {
        const firstName = trElement.dataset.firstName;
        const lastName = trElement.dataset.lastName;
        const email = trElement.dataset.email;
        const gender = trElement.dataset.gender;
        const profilePic = trElement.dataset.profilePic || '';

        document.getElementById('modalFirstName').textContent = firstName;
        document.getElementById('modalLastName').textContent = lastName;
        document.getElementById('modalEmail').textContent = email;
        document.getElementById('modalGender').textContent = gender;

        const img = document.getElementById('modalProfilePic');
        if (profilePic) {
            img.src = profilePic;
            img.classList.remove('d-none');
        } else {
            img.classList.add('d-none');
        }

        viewStudentModal.show();
    }

    // Open Edit Student modal
    function openEditStudentModal(trElement) {
        const id = trElement.dataset.studentId;
        const firstName = trElement.dataset.firstName;
        const lastName = trElement.dataset.lastName;
        const email = trElement.dataset.email;
        const gender = trElement.dataset.gender;
        const profilePic = trElement.dataset.profilePic || '';

        // Fill form fields with the current student data
        document.getElementById('editStudentId').value = id;
        document.getElementById('editFirstNameInput').value = firstName;
        document.getElementById('editLastNameInput').value = lastName;
        document.getElementById('editEmailInput').value = email;
        document.getElementById('editGenderSelect').value = gender;

        // Set the hidden field to store the old profile picture URL
        document.getElementById('editProfilePicHidden').value = profilePic;

        // Show existing photo preview if present
        const preview = document.getElementById('editProfilePicPreview');
        if (profilePic) {
            preview.src = profilePic;
            preview.classList.remove('d-none');
        } else {
            preview.classList.add('d-none');
        }

        // Clear the file input field to allow a new file to be uploaded
        document.getElementById('editProfilePicFile').value = '';

        // Show modal
        const editStudentModalInstance = new bootstrap.Modal(document.getElementById('editStudentModal'));
        editStudentModalInstance.show();
    }

    // Handle form submission for updating student details
    document.getElementById('editStudentForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form); // Handles both text fields and file uploads

        try {
            const response = await fetch(`${apiUrl}/${formData.get('id')}`, {
                method: 'PUT',
                headers: {
                    Authorization: `Bearer ${token}`
                },
                body: formData,
            });

            if (!response.ok) throw new Error('Failed to update student');

            const updatedStudent = await response.json();
            alert('Student updated successfully!');

            // Refresh list and close modal
            fetchStudents();
            bootstrap.Modal.getInstance(document.getElementById('editStudentModal')).hide();

        } catch (error) {
            console.error(error);
            alert('Error updating student');
        }
    });

    // Search functionality + Add handlers after DOM load
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');

        // Search: server-side
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();

            if (query.length === 0) {
                // If user clears search → load all again
                fetchStudents();
            } else if (query.length >= 3) {
                // Call backend search API
                fetchStudents(query);
            }
        });

        // Add Student form
        document.getElementById('addStudentForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch(`${apiUrl}`, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error('Failed to add student');
                }

                const newStudent = await response.json();
                alert('Student added successfully!');

                // Hide modal
                const addModalEl = document.getElementById('addStudentModal');
                bootstrap.Modal.getInstance(addModalEl).hide();

                this.reset();
                fetchStudents();  // Refresh student list
            } catch (error) {
                console.error(error);
                alert('Error adding student: ' + error.message);
            }
        });

        // Optional: attach handlers to any static buttons (if present)
        document.querySelectorAll('.btn-view-student').forEach(btn => {
            btn.addEventListener('click', function () {
                const tr = this.closest('tr');
                openStudentModal(tr);
            });
        });

        document.querySelectorAll('.link-view-pic').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const tr = this.closest('tr');
                openStudentModal(tr);
            });
        });

        document.querySelectorAll('.btn-edit-student').forEach(btn => {
            btn.addEventListener('click', function () {
                const tr = this.closest('tr');
                openEditStudentModal(tr);
            });
        });

        // Initial load
        fetchStudents();
    });
</script>


</body>
</html>
