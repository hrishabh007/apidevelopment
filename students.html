<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Records</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .profile-pic {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container mt-3">
    <style>
        /* Make profile pictures circular and keep consistent size */
        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
        }
    </style>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Student Records</h2>

        <div class="d-flex align-items-center gap-2">
            <!-- Search by name -->
            <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search by name"
                    style="width: 220px;"
            >

            <!-- Button to open Add Student modal -->
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                Add Student
            </button>
        </div>
    </div>


    <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Gender</th>
            <th>Profile Pic</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="studentTableBody">

        </tbody>
    </table>
    <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- Bootstrap Modal: View Student -->
<div class="modal fade" id="viewStudentModal" tabindex="-1" aria-labelledby="viewStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="viewStudentModalLabel">Student Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="modalProfilePic" class="profile-pic mt-2 d-none" alt="Profile Picture">
                <p><strong>First Name:</strong> <span id="modalFirstName"></span></p>
                <p><strong>Last Name:</strong> <span id="modalLastName"></span></p>
                <p><strong>Email:</strong> <span id="modalEmail"></span></p>
                <p><strong>Gender:</strong> <span id="modalGender"></span></p>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Student Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="addStudentForm" action="/students" method="POST" enctype="multipart/form-data">
            <div class="modal-header">
                <h5 class="modal-title" id="addStudentModalLabel">Add Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Student Fields -->
                <div class="mb-3">
                    <label for="firstNameInput" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstNameInput" name="first_name" required>
                </div>

                <div class="mb-3">
                    <label for="lastNameInput" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastNameInput" name="last_name" required>
                </div>

                <div class="mb-3">
                    <label for="emailInput" class="form-label">Email</label>
                    <input type="email" class="form-control" id="emailInput" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="genderSelect" class="form-label">Gender</label>
                    <select class="form-select" id="genderSelect" name="gender" required>
                        <option value="">-- Select --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="profilePicInput" class="form-label">Profile Picture</label>
                    <input type="file" class="form-control" id="profilePicInput" name="profile_pic" accept="image/*">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Student</button>
            </div>
        </form>
    </div>
</div>


<!-- Bootstrap Modal: Edit Student -->
<div class="modal fade" id="editStudentModal" tabindex="-1" aria-labelledby="editStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <!-- action will be set dynamically in JS based on student id -->
        <form class="modal-content" id="editStudentForm" method="post" enctype="multipart/form-data">

            <div class="modal-header">
                <h5 class="modal-title" id="editStudentModalLabel">Edit Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- first_name -->
                <div class="mb-3">
                    <label for="editFirstNameInput" class="form-label">First Name</label>
                    <input
                            type="text"
                            class="form-control"
                            id="editFirstNameInput"
                            name="first_name"
                            required
                    >
                </div>

                <!-- last_name -->
                <div class="mb-3">
                    <label for="editLastNameInput" class="form-label">Last Name</label>
                    <input
                            type="text"
                            class="form-control"
                            id="editLastNameInput"
                            name="last_name"
                            required
                    >
                </div>

                <!-- email -->
                <div class="mb-3">
                    <label for="editEmailInput" class="form-label">Email</label>
                    <input
                            type="email"
                            class="form-control"
                            id="editEmailInput"
                            name="email"
                            required
                    >
                </div>

                <!-- gender -->
                <div class="mb-3">
                    <label for="editGenderSelect" class="form-label">Gender</label>
                    <select
                            class="form-select"
                            id="editGenderSelect"
                            name="gender"
                            required
                    >
                        <option value="">-- Select --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- existing profile picture preview -->
                <div class="mb-3 text-center">
                    <label class="form-label">Current Profile Picture</label>
                    <br>
                    <img
                            id="editProfilePicPreview"
                            src=""
                            alt="No Image"
                            class="profile-pic d-none"
                            style="max-width:150px; border:1px solid #ccc; padding:4px; border-radius:8px;"
                    >
                </div>

                <!--                &lt;!&ndash; hidden field to store previous URL &ndash;&gt;-->
                <input type="hidden" id="editProfilePicHidden" name="existing_profile_pic">

                <!-- upload new profile_pic -->
                <div class="mb-3">
                    <label for="editProfilePicFile" class="form-label">Upload New Profile Pic</label>
                    <input
                            type="file"
                            class="form-control"
                            id="editProfilePicFile"
                            name="profile_pic"
                    accept="image/*"
                    />
                    >
                </div>

                <!-- hidden id if you want -->
                <input type="hidden" id="editStudentId" name="id">
            </div>
            <div class="modal-footer">
                <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                >
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">Update Student</button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const apiUrl = 'http://localhost:3000/api/students'; // match your Node server PORT
    let studentsCache = []; // Array to store all students
    let currentPage = 1;
    let currentLimit = 5; // same as backend default
    let currentSearch = "";

    async function fetchStudents(search = "", page = 1, limit = 3) {
        try {
            const response = await fetch(
                `${apiUrl}?search=${encodeURIComponent(search)}&page=${page}&limit=${limit}`
            );

            if (!response.ok) throw new Error("Failed to fetch students");

            const data = await response.json();

            console.log("API Response:", data);

            // FIX: Extract array from API
            studentsCache = data.students;

            // save current state
            currentPage = data.page || page;
            currentLimit = data.limit || limit;
            currentSearch = search;

            renderStudents(studentsCache, currentPage, currentLimit);
            renderPagination(data.totalPages);

        } catch (err) {
            console.error(err);
            alert("Error loading students");
        }
    }

    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';
        // Previous Button
        const prevButton = document.createElement('li');
        prevButton.classList.add('page-item');

// disable if on first page
        if (currentPage === 1) prevButton.classList.add('disabled');

        prevButton.innerHTML = `
    <a class="page-link" href="#" onclick="fetchStudents('${currentSearch}', ${currentPage - 1})">
        Previous
    </a>
`;
        paginationContainer.appendChild(prevButton);


        if (totalPages <= 1) return;
        for (let i = 1; i <= totalPages; i++) {
            const pageLink = document.createElement('li');
            pageLink.classList.add('page-item');
            pageLink.innerHTML = `<a class="page-link" href="#" onclick="fetchStudents('', ${i})">${i}</a>`;
            paginationContainer.appendChild(pageLink);
        }
        // Next Button
        const nextButton = document.createElement('li');
        nextButton.classList.add('page-item');

// disable if on last page
        if (currentPage === totalPages) nextButton.classList.add('disabled');

        nextButton.innerHTML = `
    <a class="page-link" href="#" onclick="fetchStudents('${currentSearch}', ${currentPage + 1})">
        Next
    </a>
`;
        paginationContainer.appendChild(nextButton);
    }

    function renderStudents(students, page = 1, limit = 5) {
        const tbody = document.querySelector('#studentTableBody');
        tbody.innerHTML = '';

        const startIndex = (page - 1) * limit; // 👈 offset for pagination

        students.forEach((student, index) => {
            const tr = document.createElement('tr');

            tr.dataset.studentId = student._id;
            tr.dataset.firstName = student.first_name;
            tr.dataset.lastName = student.last_name;
            tr.dataset.email = student.email;
            tr.dataset.gender = student.gender;
            tr.dataset.profilePic = student.profile_pic || '';

            tr.innerHTML = `
            <td>${startIndex + index + 1}</td>
            <td>${student.first_name}</td>
            <td>${student.last_name}</td>
            <td>${student.email}</td>
            <td>${student.gender}</td>
            <td>
                ${student.profile_pic
                ? `<img src="${student.profile_pic}" alt="Profile Pic" class="profile-pic">`
                : 'N/A'}
            </td>
            <td>
                <button type="button" onclick="openStudentModal(this.closest('tr'))" class="btn btn-sm btn-primary">
                    View
                </button>
                <button type="button" onclick="openEditStudentModal(this.closest('tr'))" class="btn btn-sm btn-warning">
                    Edit
                </button>
                <button type="button" onclick="deleteStudent(this.closest('tr').dataset.studentId)" class="btn btn-sm btn-danger">
                    Delete
                </button>
            </td>
        `;

            tbody.appendChild(tr);
        });
    }


    async function deleteStudent(id) {
        if (!confirm('Are you sure you want to delete this student?')) return;

        try {
            const response = await fetch(`${apiUrl}/${id}`, {
                method: 'DELETE',
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || 'Failed to delete student');
            }

            // reload table after delete
            await fetchStudents();
        } catch (err) {
            console.error(err);
            alert('Error deleting student');
        }
    }

    // initial load
    fetchStudents();
</script>

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();

            if (query.length === 0) {
                // If user clears search → load all again
                fetchStudents();
            } else if (query.length >= 3) {
                // Call backend search API
                fetchStudents(query);

    document.getElementById('addStudentForm').addEventListener('submit', async function (event) {

</body>
</html>
